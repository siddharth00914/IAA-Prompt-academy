services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: iaa_prompt_academy
      POSTGRES_USER: iaa_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - iaa_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iaa_app -d iaa_prompt_academy"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  iaa_pg_data:
